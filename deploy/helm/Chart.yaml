apiVersion: v2
name: litellm
description: A Helm chart for deploying LiteLLM proxy service with optional Streamlit UI
type: application
version: 0.3.0
appVersion: "v1.80.5-stable"
keywords:
  - litellm
  - llm
  - proxy
  - ai
  - streamlit
  - postgresql
  - pgvector
  - llama-stack
maintainers:
  - name: LiteLLM Team

dependencies:
  - name: redis
    version: 18.19.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled

  - name: pgvector
    version: 0.5.2
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: pgvector.enabled

  - name: llama-stack
    version: 0.6.4
    repository: https://rh-ai-quickstart.github.io/ai-architecture-charts
    condition: llama-stack.enabled