{{- if index .Values "llama-stack" "route" "enabled" }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: llamastack
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
    app.kubernetes.io/component: llamastack
spec:
  {{- with (index .Values "llama-stack" "route" "host") }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: llamastack
    weight: 100
  port:
    targetPort: http
  {{- if (index .Values "llama-stack" "route" "tls") }}
  tls:
    termination: {{ (index .Values "llama-stack" "route" "tls" "termination") }}
    {{- with (index .Values "llama-stack" "route" "tls" "insecureEdgeTerminationPolicy") }}
    insecureEdgeTerminationPolicy: {{ . }}
    {{- end }}
  {{- end }}
  wildcardPolicy: None
{{- end }}
