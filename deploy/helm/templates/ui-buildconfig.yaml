{{- if and .Values.ui.enabled .Values.ui.build.enabled }}
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ include "litellm.fullname" . }}-ui
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  output:
    to:
      kind: ImageStreamTag
      name: {{ include "litellm.fullname" . }}-ui:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: {{ .Values.ui.build.dockerfilePath | default "Containerfile" }}
      {{- if .Values.ui.build.buildArgs }}
      buildArgs:
        {{- toYaml .Values.ui.build.buildArgs | nindent 8 }}
      {{- end }}
  triggers: []
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ include "litellm.fullname" . }}-ui
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
{{- end }}

