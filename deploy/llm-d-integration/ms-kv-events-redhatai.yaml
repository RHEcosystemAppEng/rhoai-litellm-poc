# RedHatAI DeepSeek-R1 Model Configuration for LLM-D
# Overrides for ms-kv-events/values.yaml to use RedHatAI/DeepSeek-R1-Distill-Qwen-7B-quantized.w8a8

multinode: false

modelArtifacts:
  uri: "hf://RedHatAI/DeepSeek-R1-Distill-Qwen-7B-quantized.w8a8"
  size: 100Gi  # Larger storage for 7B quantized model
  authSecretName: "llm-d-hf-token"
  name: "RedHatAI/DeepSeek-R1-Distill-Qwen-7B-quantized.w8a8"

routing:
  servicePort: 8000
  proxy:
    image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.4.0-rc.1
    connector: nixlv2
    secure: false

decode:
  create: true
  replicas: 1  # Single replica for single L40S GPU
  # Note: nodeSelector will be patched after deployment due to chart schema restrictions
  monitoring:
    podmonitor:
      enabled: true
      portName: "metrics"
      path: "/metrics"
      interval: "30s"
  containers:
  - name: "vllm"
    image: ghcr.io/llm-d/llm-d-cuda:v0.3.1
    modelCommand: custom
    command:
      - /bin/sh
      - '-c'
    args:
      - |
        vllm serve RedHatAI/DeepSeek-R1-Distill-Qwen-7B-quantized.w8a8 \
        --host 0.0.0.0 \
        --port 8200 \
        --block-size 64 \
        --prefix-caching-hash-algo sha256_cbor \
        --max-model-len 16384 \
        --gpu-memory-utilization 0.80 \
        --trust-remote-code \
        --kv-transfer-config '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}' \
        --kv-events-config "{\"enable_kv_cache_events\":true,\"publisher\":\"zmq\",\"endpoint\":\"tcp://gaie-${GAIE_RELEASE_NAME_POSTFIX}-epp.${NAMESPACE}.svc.cluster.local:5557\",\"topic\":\"kv@${POD_IP}@RedHatAI/DeepSeek-R1-Distill-Qwen-7B-quantized.w8a8\"}"
    env:
      - name: GAIE_RELEASE_NAME_POSTFIX # index 0 matters because of set in helmfile
      - name: NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: PYTHONHASHSEED
        value: "42"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_LOGGING_LEVEL
        value: INFO  # Changed from DEBUG for production
      # L40S GPU optimization
      - name: VLLM_GPU_MEMORY_UTILIZATION
        value: "0.80"
      - name: VLLM_MAX_MODEL_LEN
        value: "16384"
      - name: VLLM_QUANTIZATION
        value: "marlin"
    ports:
      - containerPort: 5557
        protocol: TCP
      - containerPort: 8200
        name: metrics
        protocol: TCP
    resources:
      limits:
        nvidia.com/gpu: "1"
        cpu: "6"
        memory: "16Gi"  # Reduced memory for cluster constraints
      requests:
        nvidia.com/gpu: "1"
        cpu: "2"
        memory: "8Gi"
    mountModelVolume: true
    volumeMounts:
    - name: metrics-volume
      mountPath: /.config
    - name: torch-compile-cache
      mountPath: /.cache
    startupProbe:
      httpGet:
        path: /v1/models
        port: 8200
      initialDelaySeconds: 60  # Longer delay for model loading
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 20  # More attempts for large model
    livenessProbe:
      httpGet:
        path: /health
        port: 8200
      periodSeconds: 30  # Less frequent checks
      timeoutSeconds: 10
      failureThreshold: 5
    readinessProbe:
      httpGet:
        path: /v1/models
        port: 8200
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  volumes:
  - name: metrics-volume
    emptyDir: {}
  - name: torch-compile-cache
    emptyDir: {}

# PD disabled for single GPU deployment
prefill:
  create: false